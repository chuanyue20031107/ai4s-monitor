name: Single source crawl

on:
  workflow_dispatch:
    inputs:
      source_id:
        description: Source id to crawl
        required: true
        type: string

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Crawl selected source
        env:
          SOURCE_ID: ${{ inputs.source_id }}
        run: node scripts/source-single-crawl.mjs
      - name: Export frontend data
        run: node scripts/pipeline.mjs
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data client/public/data
          if ! git diff --cached --quiet; then
            git commit -m "data: crawl single source"
            git push
          fi
