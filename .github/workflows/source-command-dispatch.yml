name: Source command dispatch

on:
  workflow_dispatch:
    inputs:
      action:
        description: Source action
        required: true
        type: choice
        options:
          - health_check
          - crawl_source
      source_id:
        description: Source id
        required: true
        type: string

permissions:
  contents: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Create command request
        env:
          ACTION_TYPE: ${{ inputs.action }}
          SOURCE_ID: ${{ inputs.source_id }}
        run: |
          mkdir -p data/commands/pending
          FILE="data/commands/pending/${ACTION_TYPE}-${SOURCE_ID}-$(date -u +%Y%m%dT%H%M%SZ).json"
          cat > "$FILE" <<EOF
          {
            "id": "$(uuidgen)",
            "action": "$ACTION_TYPE",
            "sourceId": "$SOURCE_ID",
            "createdAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "status": "pending"
          }
          EOF
      - name: Commit command
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/commands/pending
          git commit -m "ops: submit source command" || true
          git push
