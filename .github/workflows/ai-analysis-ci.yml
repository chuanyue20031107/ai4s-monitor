name: Analysis publication CI
on:
  pull_request:
    paths:
      - 'scripts/pipeline.mjs'
      - 'tests/pipeline.test.mjs'
      - '.github/workflows/ai-analysis-*.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/pipeline.mjs'
      - 'tests/pipeline.test.mjs'
      - '.github/workflows/ai-analysis-*.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: node --test tests/pipeline.test.mjs
