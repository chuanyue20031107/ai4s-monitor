name: Crawl and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      batch_size:
        description: Number of sources to crawl in this run
        required: false
        default: '60'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ai4s-crawl-and-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Crawl sources into the GitHub JSON database
        env:
          BATCH_SIZE: ${{ inputs.batch_size || '36' }}
          # Public Railway endpoint for the optional WeRSS sidecar.
          # WeChat sources still require feed_id + enabled=true in config/wechat_sources.csv.
          WERSS_BASE_URL: https://werss-production-d388.up.railway.app/
        run: npm run crawl

      - name: Commit refreshed database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/public/data
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh AI4S intelligence [skip ci]"
            git push
          fi

      - name: Build frontend
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/client

  deploy:
    if: github.actor != 'github-actions[bot]'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
